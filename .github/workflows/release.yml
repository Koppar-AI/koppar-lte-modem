# Release the host software: push a tag like v0.3.0.
#
# - Tests (host/tests).
# - The CLI as a standalone program (its own Python; nothing to install) for
#   macOS (Apple Silicon, Intel) and Linux (x86-64, ARM64), plus a wheel and
#   sdist for pip.
# - Koppar Phone.app, the macOS menu-bar app, with that CLI inside it.
# - A GitHub release with all of it and SHA256SUMS.
#
# Run it by hand (Actions > Release > Run workflow) to build everything as
# artifacts without making a release.
#
# Signing the macOS app is optional. With these repository secrets the app is
# signed with a Developer ID and notarized, so it opens without a warning:
#   MACOS_CERT_P12          base64 of the "Developer ID Application" certificate (.p12)
#   MACOS_CERT_PASSWORD     its password
#   MACOS_SIGN_IDENTITY     e.g. "Developer ID Application: Name (TEAMID)"
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD   for notarytool
# Without them the app is signed ad hoc: macOS asks you to confirm it the
# first time (right-click > Open).

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version for a test build (artifacts only, no release)"
        default: "0.0.0-dev"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  LIBUSB_VERSION: "1.0.29"
  LIBUSB_SHA256: "5977fc950f8d1395ccea9bd48c06b3f808fd3c2c961b44b0c2e6e29fc3a70a85"
  PYINSTALLER_VERSION: "6.22.3"
  BUILD_VERSION: "1.6.1"

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e ".[test]"
      - run: PYTHONPATH=tests python -m pytest -q tests

  python:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Version
        env:
          RAW_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          V="${RAW_VERSION#v}"
          echo "$V" | grep -Eq '^[0-9A-Za-z][0-9A-Za-z.+-]{0,40}$' || { echo "bad version: $V"; exit 1; }
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - name: Build wheel and sdist
        working-directory: host
        run: |
          sed -i "s/^version = .*/version = \"$VERSION\"/" pyproject.toml
          pip install "build==${BUILD_VERSION}"
          python -m build --outdir ../out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: python
          path: out/*

  standalone:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: macos-arm64, arch: arm64 }
          - { os: macos-15-intel, target: macos-x86_64, arch: x86_64 }
          # The oldest images available, so the builds run on older glibc too.
          - { os: ubuntu-22.04, target: linux-x86_64 }
          - { os: ubuntu-22.04-arm, target: linux-arm64 }
    runs-on: ${{ matrix.os }}
    env:
      SIGN: ${{ secrets.MACOS_CERT_P12 != '' }}     # a flag only: the secret itself stays in the signing step
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Version
        shell: bash
        env:
          RAW_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          V="${RAW_VERSION#v}"
          echo "$V" | grep -Eq '^[0-9A-Za-z][0-9A-Za-z.+-]{0,40}$' || { echo "bad version: $V"; exit 1; }
          echo "VERSION=$V" >> "$GITHUB_ENV"

      # The EC25's AT port goes through libusb on macOS. Built here rather
      # than taken from Homebrew, whose bottles need the runner's macOS.
      - name: libusb (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -fsSL -o libusb.tar.bz2 "https://github.com/libusb/libusb/releases/download/v${LIBUSB_VERSION}/libusb-${LIBUSB_VERSION}.tar.bz2"
          echo "${LIBUSB_SHA256}  libusb.tar.bz2" | shasum -a 256 -c -
          tar xjf libusb.tar.bz2
          cd "libusb-${LIBUSB_VERSION}"
          MACOSX_DEPLOYMENT_TARGET=12.0 ./configure --prefix="$PWD/out" --disable-static --quiet
          make -j"$(sysctl -n hw.ncpu)" install > /dev/null
          echo "KOPPAR_LIBUSB_DYLIB=$PWD/out/lib/libusb-1.0.0.dylib" >> "$GITHUB_ENV"

      # Call audio on Linux needs PortAudio; with it present the build picks it up.
      - name: PortAudio (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libportaudio2

      - name: Standalone CLI
        working-directory: host
        shell: bash
        run: |
          sed -i.bak "s/^version = .*/version = \"$VERSION\"/" pyproject.toml && rm pyproject.toml.bak
          pip install "pyinstaller==${PYINSTALLER_VERSION}" ".[audio]"
          PYTHON=python packaging/build-cli.sh
          ./dist/koppar-lte-modem/koppar-lte-modem --help
          mkdir -p ../out
          tar -czf "../out/koppar-lte-modem-${VERSION}-${{ matrix.target }}.tar.gz" -C dist koppar-lte-modem

      - name: Signing keychain (macOS, with secrets)
        if: runner.os == 'macOS' && env.SIGN == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          KC="$RUNNER_TEMP/sign.keychain-db"
          KC_PW="$(openssl rand -hex 16)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          echo "KOPPAR_SIGN_IDENTITY=$MACOS_SIGN_IDENTITY" >> "$GITHUB_ENV"

      - name: Koppar Phone.app (macOS)
        if: runner.os == 'macOS'
        working-directory: host/macos
        env:
          KOPPAR_EMBED_CLI: ../dist/koppar-lte-modem
          KOPPAR_ARCH: ${{ matrix.arch }}
        run: |
          brew install librsvg > /dev/null
          ./build.sh
          ditto -c -k --keepParent "build/Koppar Phone.app" "../../out/Koppar-Phone-${VERSION}-${{ matrix.target }}.zip"

      - name: Notarize (macOS, with secrets)
        if: runner.os == 'macOS' && env.SIGN == 'true'
        working-directory: host/macos
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ZIP="../../out/Koppar-Phone-${VERSION}-${{ matrix.target }}.zip"
          xcrun notarytool submit "$ZIP" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "build/Koppar Phone.app"
          rm "$ZIP" && ditto -c -k --keepParent "build/Koppar Phone.app" "$ZIP"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: standalone-${{ matrix.target }}
          path: out/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [python, standalone]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        working-directory: out
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "$GITHUB_REF_NAME" | grep -Eq '^v[0-9A-Za-z.+-]{1,40}$' || { echo "bad tag"; exit 1; }
          gh release create "$GITHUB_REF_NAME" out/* --verify-tag --generate-notes \
            --title "Koppar Phone ${GITHUB_REF_NAME#v}"
